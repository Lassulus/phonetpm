[workspace]
resolver = "2"
members = ["crates/proto", "crates/host", "crates/mobile"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
phonetpm-proto = { path = "crates/proto" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
iroh = { version = "1.2", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8", "std"] }
sha2 = "0.10"
hkdf = "0.12"
chacha20poly1305 = "0.10"
base64 = "0.22"
bech32 = "0.9"
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
